plugins {
    id 'com.android.application'
}

def releaseVersion = new Properties()
rootProject.file('version.properties').withInputStream { releaseVersion.load(it) }
// Stable and dev CI releases share a monotonic bucket derived from version.properties.
def ciRunNumber = project.findProperty('ciRunNumber')
def devBuild = project.findProperty('devBuild') == 'true'
def appVersionCode = releaseVersion.getProperty('VERSION_CODE').toInteger()
def appVersionName = releaseVersion.getProperty('VERSION_NAME')
if (ciRunNumber != null) {
    def sequence = ciRunNumber.toString().toLong()
    def expanded = appVersionCode.toLong() * 100000L + sequence
    if (sequence < 1L || sequence >= 100000L || expanded > 2100000000L
            || !(appVersionName ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/)) {
        throw new GradleException('Invalid CI release version bucket')
    }
    appVersionCode = expanded.toInteger()
    if (devBuild) appVersionName += '-dev.' + sequence
} else if (devBuild) {
    throw new GradleException('Development release identity requires ciRunNumber')
}

def replacementLabCandidate = project.findProperty('replacementLabCandidate') ?: 'false'
if (!(replacementLabCandidate in ['true', 'false'])) {
    throw new GradleException('replacementLabCandidate must be true or false')
}

def signingStorePath = System.getenv('SUBHUB_SIGNING_STORE_FILE')
def signingStorePassword = System.getenv('SUBHUB_SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('SUBHUB_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('SUBHUB_SIGNING_KEY_PASSWORD')
def releaseSigningValues = [
        signingStorePath,
        signingStorePassword,
        signingKeyAlias,
        signingKeyPassword
]
def hasAnyReleaseSigning = releaseSigningValues.any { it != null && !it.trim().isEmpty() }
def hasReleaseSigning = releaseSigningValues.every { it != null && !it.trim().isEmpty() }
if (hasAnyReleaseSigning && !hasReleaseSigning) {
    throw new GradleException('Release signing is incomplete; provide all SUBHUB_SIGNING_* variables')
}

android {
    namespace 'com.subhub.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.subhub.app'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'String', 'BUILD_DATE',
                '"' + java.time.LocalDate.now(java.time.ZoneOffset.UTC).toString() + '"'
        buildConfigField 'boolean', 'IMMEDIATE_QUALITY_EXPERIMENT',
                (project.findProperty('immediateQualityExperiment') == 'true' ? 'true' : 'false')
        buildConfigField 'boolean', 'REPLACEMENT_LAB_CANDIDATE', replacementLabCandidate

        testInstrumentationRunner 'com.subhub.app.SubHubTestRunner'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Keep compact per-ABI artifacts for direct installs and also emit a universal APK for
    // releases. The universal artifact supports every ABI shipped by our native dependencies.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }

    lint {
        // The restored selector intentionally localizes the navigation/help shell first;
        // untranslated feature detail is expected to fall back to reviewed English copy.
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'com.paypal.android:fraud-protection:3.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.work:work-testing:2.11.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.work:work-testing:2.11.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}
