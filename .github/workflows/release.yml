name: Release

on:
  push:
    branches-ignore:
      - master
    tags:
      - "v*"
      - "!v*-dev.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable release tag to build"
        required: true
        type: string
      build_ref:
        description: "Optional branch or commit to sign instead of the release tag"
        required: false
        type: string
      publish_release:
        description: "Publish signed assets as a GitHub Release"
        required: true
        default: true
        type: boolean
      immediate_quality_experiment:
        description: "Enable same-capture quality refresh in a private signed candidate only"
        required: false
        default: false
        type: boolean
      replacement_lab_candidate:
        description: "Allow explicit replacement-engine selection in a private signed candidate only"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      BUILD_REF: ${{ inputs.build_ref || inputs.release_tag || github.sha }}
      PUBLISH_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
      IMMEDIATE_QUALITY_EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.immediate_quality_experiment || false }}
      REPLACEMENT_LAB_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.replacement_lab_candidate || false }}
      DEV_BUILD: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      CI_RUN_NUMBER: ${{ github.run_number }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag and version metadata
        id: version
        shell: bash
        run: |
          python3 scripts/release_candidate_policy.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --publish-release "$PUBLISH_RELEASE" \
            --immediate-quality-experiment "$IMMEDIATE_QUALITY_EXPERIMENT" \
            --replacement-lab-candidate "$REPLACEMENT_LAB_CANDIDATE"
          if [[ "$DEV_BUILD" == "true" ]]; then
            python3 scripts/release_version.py \
              --ci-run-number "$CI_RUN_NUMBER" --dev-build \
              --github-output "${GITHUB_OUTPUT}"
          elif [[ "$PUBLISH_RELEASE" == "true" ]]; then
            # A stable tag must identify the tested source on master, never an arbitrary branch.
            test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
            git merge-base --is-ancestor HEAD origin/master
            python3 scripts/release_version.py \
              --tag "${RELEASE_TAG}" \
              --ci-run-number "$CI_RUN_NUMBER" \
              --github-output "${GITHUB_OUTPUT}"
          elif [[ "$REPLACEMENT_LAB_CANDIDATE" == "true" ]]; then
            # Manual private candidates share the release sequence for in-place Android updates.
            python3 scripts/release_version.py \
              --ci-run-number "$CI_RUN_NUMBER" \
              --github-output "${GITHUB_OUTPUT}"
          else
            python3 scripts/release_version.py --github-output "${GITHUB_OUTPUT}"
          fi
      - name: Resolve publication identity
        env:
          EFFECTIVE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if [[ "$DEV_BUILD" == "true" ]]; then
            echo "RELEASE_TAG=$EFFECTIVE_TAG" >> "$GITHUB_ENV"
          fi
      - name: Test release-note generation
        run: python3 -m unittest scripts.test_generate_release_notes scripts.test_release_version scripts.test_release_candidate_policy scripts.test_analyze_replacement_trace
      - name: Restore release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SUBHUB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/subhub-release.jks"
      - name: Test, lint, and build signed release APKs
        env:
          SUBHUB_SIGNING_STORE_FILE: ${{ runner.temp }}/subhub-release.jks
          SUBHUB_SIGNING_STORE_PASSWORD: ${{ secrets.SUBHUB_SIGNING_STORE_PASSWORD }}
          SUBHUB_SIGNING_KEY_ALIAS: ${{ secrets.SUBHUB_SIGNING_KEY_ALIAS }}
          SUBHUB_SIGNING_KEY_PASSWORD: ${{ secrets.SUBHUB_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SUBHUB_SIGNING_STORE_PASSWORD"
          test -n "$SUBHUB_SIGNING_KEY_ALIAS"
          test -n "$SUBHUB_SIGNING_KEY_PASSWORD"
          build_args=("-PimmediateQualityExperiment=${IMMEDIATE_QUALITY_EXPERIMENT}" "-PreplacementLabCandidate=${REPLACEMENT_LAB_CANDIDATE}" "-PdevBuild=$DEV_BUILD")
          if [[ "$PUBLISH_RELEASE" == "true" || "$REPLACEMENT_LAB_CANDIDATE" == "true" ]]; then
            build_args+=("-PciRunNumber=$CI_RUN_NUMBER")
          fi
          ./gradlew --max-workers=2 --stacktrace testDebugUnitTest lintDebug lintRelease assembleDebug assembleDebugAndroidTest assembleRelease "${build_args[@]}"
          grep -F "IMMEDIATE_QUALITY_EXPERIMENT = ${IMMEDIATE_QUALITY_EXPERIMENT};" \
            app/build/generated/source/buildConfig/release/com/subhub/app/BuildConfig.java
          grep -F "REPLACEMENT_LAB_CANDIDATE = ${REPLACEMENT_LAB_CANDIDATE};" \
            app/build/generated/source/buildConfig/release/com/subhub/app/BuildConfig.java
          grep -F "VERSION_CODE = ${{ steps.version.outputs.version_code }};" \
            app/build/generated/source/buildConfig/release/com/subhub/app/BuildConfig.java
          grep -F 'VERSION_NAME = "${{ steps.version.outputs.version_name }}";' \
            app/build/generated/source/buildConfig/release/com/subhub/app/BuildConfig.java
      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done
      - name: Stage versioned release artifacts
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          output="app/build/outputs/apk/release"
          universal="$output/app-universal-release.apk"
          test -f "$universal"
          mkdir -p dist
          cp "$universal" "dist/SubHub-${VERSION_NAME}-universal.apk"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk="$output/app-${abi}-release.apk"
            test -f "$apk"
            cp "$apk" "dist/SubHub-${VERSION_NAME}-${abi}.apk"
          done
          sha256sum dist/*.apk > "dist/SubHub-${VERSION_NAME}-SHA256SUMS.txt"
      - name: Compose release changelog
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEV_BUILD" == "true" ]]; then
            python3 scripts/generate_release_notes.py \
              --tag HEAD --display-tag "$RELEASE_TAG" \
              --development-before "$PUSH_BEFORE" \
              --repository "$GITHUB_REPOSITORY" \
              --changelog-output dist/changelog.md --release-output dist/release-notes.md
          else
            python3 scripts/generate_release_notes.py \
              --tag "${RELEASE_TAG}" \
              --repository "${GITHUB_REPOSITORY}" \
              --changelog-output dist/changelog.md \
              --release-output dist/release-notes.md
          fi
      - name: Compose updater manifest
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION_NAME"]
          code = int(os.environ["VERSION_CODE"])
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          dist = Path("dist")
          assets = []
          for abi in ("universal", "armeabi-v7a", "arm64-v8a", "x86", "x86_64"):
              name = f"SubHub-{version}-{abi}.apk"
              path = dist / name
              data = path.read_bytes()
              assets.append({
                  "abi": abi,
                  "name": name,
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{name}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              })
          manifest = {
              "schema": 1,
              "packageName": "com.subhub.app",
              "versionName": version,
              "versionCode": code,
              "minSdk": 26,
              "tag": tag,
              "releaseNotes": (dist / "changelog.md").read_text(encoding="utf-8"),
              "sourceCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "prerelease": os.environ["DEV_BUILD"] == "true",
              "assets": assets,
          }
          output = dist / f"SubHub-{version}-update.json"
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' > release-draft.txt 2>/dev/null; then
            test "$(cat release-draft.txt)" = "true"
            gh release edit "${RELEASE_TAG}" \
              --notes-file dist/release-notes.md \
              --title "SubHub ${VERSION_NAME}"
          else
            if [[ "$DEV_BUILD" == "true" ]]; then
              gh release create "$RELEASE_TAG" --draft --prerelease --latest=false \
                --target "$(git rev-parse HEAD)" --notes-file dist/release-notes.md \
                --title "SubHub ${VERSION_NAME}"
            else
              gh release create "${RELEASE_TAG}" \
                --draft --verify-tag --notes-file dist/release-notes.md \
                --title "SubHub ${VERSION_NAME}"
            fi
          fi

          if [[ "$DEV_BUILD" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --latest=false
          fi

          for asset in \
            dist/*.apk \
            dist/*-update.json \
            dist/*-SHA256SUMS.txt; do
            gh release upload "${RELEASE_TAG}" "$asset" --clobber
          done

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = {
              path.name: path.stat().st_size
              for path in Path("dist").iterdir()
              if path.suffix == ".apk"
              or path.name.endswith("-update.json")
              or path.name.endswith("-SHA256SUMS.txt")
          }
          release = json.loads(subprocess.check_output([
              "gh", "release", "view", os.environ["RELEASE_TAG"],
              "--json", "assets",
          ], text=True))
          actual = {asset["name"]: asset["size"] for asset in release["assets"]}
          if actual != expected:
              raise SystemExit(f"Release asset mismatch: expected {expected}, got {actual}")
          PY

          gh release edit "${RELEASE_TAG}" --draft=false

      - name: Record private signed-build provenance
        if: github.event_name == 'workflow_dispatch' && env.PUBLISH_RELEASE != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          provenance = {
              "sourceCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflowCommit": os.environ["WORKFLOW_SHA"],
              "immediateQualityExperiment": os.environ["IMMEDIATE_QUALITY_EXPERIMENT"] == "true",
              "replacementLabCandidate": os.environ["REPLACEMENT_LAB_CANDIDATE"] == "true",
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "ciRunNumber": int(os.environ["CI_RUN_NUMBER"]),
              "sharedCiVersion": os.environ["REPLACEMENT_LAB_CANDIDATE"] == "true",
              "publishedRelease": False,
          }
          Path("dist/SubHub-build.json").write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload private signed-build artifact
        if: github.event_name == 'workflow_dispatch' && env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-${{ steps.version.outputs.version_name }}-signed-immediate-${{ inputs.immediate_quality_experiment && 'on' || 'off' }}-replacement-${{ inputs.replacement_lab_candidate && 'on' || 'off' }}-${{ github.run_id }}
          path: |
            dist/*.apk
            dist/*-SHA256SUMS.txt
            dist/*-build.json
          if-no-files-found: error
          retention-days: 7

      - name: Stage compact Pixel checksum
        if: github.event_name == 'workflow_dispatch' && env.PUBLISH_RELEASE != 'true'
        run: sha256sum dist/*-arm64-v8a.apk > dist/SubHub-pixel-SHA256SUMS.txt

      - name: Upload compact private Pixel artifact
        if: github.event_name == 'workflow_dispatch' && env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-${{ steps.version.outputs.version_name }}-pixel-immediate-${{ inputs.immediate_quality_experiment && 'on' || 'off' }}-replacement-${{ inputs.replacement_lab_candidate && 'on' || 'off' }}-${{ github.run_id }}
          path: |
            dist/*-arm64-v8a.apk
            dist/SubHub-pixel-SHA256SUMS.txt
            dist/SubHub-build.json
          if-no-files-found: error
          retention-days: 7
