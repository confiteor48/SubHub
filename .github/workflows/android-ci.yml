name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify version metadata
        run: python3 scripts/release_version.py
      - name: Test release-note generation
        run: |
          python3 -m unittest scripts.test_generate_release_notes scripts.test_release_version
          python3 scripts/generate_release_notes.py --tag HEAD --check-only
      - name: Test, lint, and build universal APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Stage universal APK
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          apk="app/build/outputs/apk/debug/app-universal-debug.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/SubHub-${version}-universal-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SubHub-universal-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
